name: RelayDemo
options:
  bundleIdPrefix: com.relay.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Relay:
    path: ..
targets:
  RelayDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RelayDemo/Sources
    resources:
      - path: RelayDemo/Resources
    info:
      path: RelayDemo/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Relay calls use the microphone for audio during a call."
        NSCameraUsageDescription: "Relay calls use the camera for video during a call."
        UIBackgroundModes:
          - voip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: RelayDemo/RelayDemo.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.relay.demo.RelayDemo
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Relay
        product: RelayCore
      - package: Relay
        product: RelayUI
      - package: Relay
        product: RelayCall
schemes:
  RelayDemo:
    build:
      targets:
        RelayDemo: all
    run:
      config: Debug
